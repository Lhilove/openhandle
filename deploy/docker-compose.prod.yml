# Production stack for a single Oracle Cloud (or any) VM:
#
#   postgres  -> data, private to the compose network, no published port
#   api       -> the OpenHandle Go API, reachable only through Caddy
#   caddy     -> TLS termination for the API origin (automatic certificates)
#
# Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml -p openhandle --env-file deploy/.env up -d --build
#
# Every ${...:?...} value is required: the stack refuses to start rather than
# booting with a default password or a missing secret.

services:
  db:
    image: postgres:16-alpine
    container_name: openhandle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openhandle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-openhandle}
    # Intentionally no ports: the database is only reachable inside the stack.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openhandle} -d ${POSTGRES_DB:-openhandle}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      # Build context is the repository root (this file lives in deploy/).
      context: ..
      dockerfile: deploy/Dockerfile
    image: openhandle-api:local
    container_name: openhandle-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Public origins. These appear in profile URLs and OAuth redirects, so
      # they must be the addresses a browser actually uses.
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL to your Vercel URL}
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL to https://$API_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS to your Vercel URL}

      # Inside the compose network, so no TLS on this hop.
      DATABASE_URL: postgres://${POSTGRES_USER:-openhandle}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openhandle}?sslmode=disable

      SESSION_SECRET: ${SESSION_SECRET:?generate with openssl rand -hex 32}

      # Browser requests arrive through the Vercel rewrite, which overwrites
      # X-Forwarded-For with the visitor's address; "forwarded" makes rate
      # limiting key on the visitor instead of on the proxy.
      CLIENT_IP_MODE: ${CLIENT_IP_MODE:-forwarded}
      # SameSite=Lax is correct here because the browser only ever talks to the
      # Vercel origin (the API is proxied), so the session cookie is first-party.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # Optional: refuse any request that did not come through the proxy.
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}

      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    expose:
      - "8080"
    healthcheck:
      # The app ships its own liveness route; this is exempt from ORIGIN_SECRET.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    container_name: openhandle-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Override only for a local smoke test on a machine that already uses
      # 80/443; on the server these must be the real ports so certificates can
      # be issued and renewed.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN to the API hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
